services:
  grafana:
    image: grafana/grafana:11.6.4
    container_name: grafana-executive-dashboards
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/platform/38-enterprise-home-page.json
      - GF_LOG_LEVEL=info
      - GF_FEATURE_TOGGLES_ENABLE=
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_LOG_FILTERS=rendering:debug
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana:/var/lib/grafana/dashboards/grafana:ro
      - ./loki:/var/lib/grafana/dashboards/loki:ro
      - ./mimir:/var/lib/grafana/dashboards/mimir:ro
      - ./tempo:/var/lib/grafana/dashboards/tempo:ro
      - ./pyroscope:/var/lib/grafana/dashboards/pyroscope:ro
      - ./platform:/var/lib/grafana/dashboards/platform:ro
      - ./observability-kpi:/var/lib/grafana/dashboards/observability-kpi:ro
      - ./volume:/var/lib/grafana/dashboards/volume:ro
      - ./L0-executive:/var/lib/grafana/dashboards/L0-executive:ro
      - ./L1-domain:/var/lib/grafana/dashboards/L1-domain:ro
      - ./L2-service:/var/lib/grafana/dashboards/L2-service:ro
      - ./L3-deepdive:/var/lib/grafana/dashboards/L3-deepdive:ro
      - ./oci:/var/lib/grafana/dashboards/oci:ro
      - ./:/var/lib/grafana/dashboards/root:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - grafana-network

  # Image renderer for dashboard screenshots
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    ports:
      - "8081:8081"
    environment:
      - ENABLE_METRICS=true
      - RENDERING_MODE=default
      - RENDERING_CLUSTERING_MODE=default
    restart: unless-stopped
    networks:
      - grafana-network

  # Prometheus with empty config — provides a valid datasource target
  # so Grafana doesn't show datasource connection errors
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: prometheus-stub
    ports:
      - "9090:9090"
    volumes:
      - ./provisioning/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - grafana-network

volumes:
  grafana-storage:

networks:
  grafana-network:
    driver: bridge
